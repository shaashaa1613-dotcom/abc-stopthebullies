<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Stop the Bullies</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap" id="app">
    <header class="top">
      <div>Stop the Bullies</div>
      <button id="themeToggle" aria-label="Toggle color theme">🌗</button>
    </header>

    <div class="bar" aria-hidden="true"><i style="width:72%"></i></div>

    <section class="grid" role="list">
      <button class="s" data-action="report" role="listitem">Report</button>
      <button class="s" data-action="support" role="listitem">Get Support</button>
      <button class="s" data-action="resources" role="listitem">Resources</button>
      <button class="s" data-action="pledge" role="listitem">Take the Pledge</button>
    </section>

    <div id="toast" role="status" aria-live="polite" class="toast">Ready</div>

    <footer class="foot">
      <small>Built with ❤️ — Public awareness page</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
